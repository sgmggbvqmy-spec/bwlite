name: Release BwLite

# Compiles the app folders (App, Model, Crypto, Core, Generator, Services, State, Views: all their .swift files, as one program) into BwLite.app (with AppIcon.icns) and attaches the zip to a GitHub Release.
# BwLite talks to the Vaultwarden server itself, so nothing else is built or bundled.
#   Releases -> Draft a new release -> new tag (e.g. v1.0.0) -> Publish   : build + attach to that Release
#   Actions -> Release BwLite -> Run workflow                             : test build, zip kept as an artifact
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26   # Apple Silicon, Xcode 26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build BwLite.app
        env:
          BUNDLE_ID: io.github.${{ github.repository_owner }}.bwlite
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#bwlite-}"; VERSION="${VERSION#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          MIN=13.5   # the SwiftUI code needs macOS 13
          APP="$PWD/dist/BwLite.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          # The sources expect Xcode 26's "everything is @MainActor" default; if swiftc rejects the option, retry without it.
          # Only the app folders: vwcore/ (tests) and autofill/ (Xcode-only scaffold) also hold .swift files that must not be compiled here.
          SOURCES=($(find App Model Crypto Core Generator Services State Views -name '*.swift' | sort))
          echo "Compiling ${#SOURCES[@]} files"
          ARGS=(-parse-as-library -O -wmo -module-name BwLite -target "arm64-apple-macos$MIN" "${SOURCES[@]}" -o "$APP/Contents/MacOS/BwLite")
          swiftc -default-isolation MainActor "${ARGS[@]}" || swiftc "${ARGS[@]}"

          cp AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>BwLite</string>
            <key>CFBundleExecutable</key><string>BwLite</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleIdentifier</key><string>${BUNDLE_ID}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>${MIN}</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>NSPrincipalClass</key><string>NSApplication</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # Ad-hoc signature.
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --strict "$APP"

          ZIP="BwLite-${VERSION}-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/$ZIP"
          (cd dist && shasum -a 256 "$ZIP" > "$ZIP.sha256")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: BwLite-${{ env.VERSION }}
          path: dist/*.zip

      - name: Attach to the Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --clobber
          if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body -q .body)" ]; then
            cat > notes.md <<EOF
          BwLite ${VERSION} for Apple Silicon. It talks to your Vaultwarden server directly (no bw inside).
          Log in again after updating from a bw-based version: the old local copy is not reused.

          Not notarized: on first launch open System Settings > Privacy & Security > "Open Anyway",
          or run \`xattr -dr com.apple.quarantine /Applications/BwLite.app\`.
          EOF
            gh release edit "$GITHUB_REF_NAME" --title "BwLite ${VERSION}" --notes-file notes.md
          fi
